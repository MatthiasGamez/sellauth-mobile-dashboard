<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116"><title>SA Dashboard</title>
<style>
:root{--bg:#0e1116;--sf:#171c24;--sf2:#202734;--tx:#e8ecf1;--mu:#8b96a8;--ac:#7c8cff;--ok:#4ad6a0;--bad:#ff7a8a;--warn:#f5c26b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
#app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:15px;font-weight:600;color:var(--mu);margin:0}
.big{font-size:44px;font-weight:700;letter-spacing:-1px;margin:4px 0 2px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.card{background:var(--sf);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{color:var(--mu);font-size:13px}.v{font-size:22px;font-weight:650}
input,select,button{font:inherit;color:var(--tx);background:var(--sf2);border:0;border-radius:12px;padding:13px 14px;width:100%}
button{background:var(--ac);color:#0b0e1a;font-weight:650;cursor:pointer}
button.g{background:var(--sf2);color:var(--tx);width:auto;padding:10px 14px}
.inv{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--sf2)}
.inv:last-child{border:0}.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sf2)}
.completed,.paid{color:var(--ok)}.pending{color:var(--warn)}.cancelled,.refunded,.failed{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{background:none;color:var(--mu);padding:10px 4px;font-size:14px}nav button.on{color:var(--tx);background:var(--sf2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px}
.bars i{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mu)}
.hide .amt{filter:blur(8px)}.err{color:var(--bad);font-size:14px;margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const API='https://api.sellauth.com/v1';
const S={key:'',shops:[],shop:null,inv:[],tab:'home',q:'',hide:false,cur:'USD',loading:false,err:'',open:null};
const $=s=>document.querySelector(s);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:S.cur}).format(n||0);
const amt=i=>Number(i.price_usd??i.price??i.total??i.amount??0);
const done=i=>['completed','paid','delivered','complete'].includes(String(i.status||'').toLowerCase())||!!i.completed_at;
const when=i=>new Date(i.completed_at||i.created_at||i.timestamp||0);
async function api(p){const r=await fetch(API+p,{headers:{Authorization:'Bearer '+S.key,Accept:'application/json'}});
 if(r.status===401)throw Error('Invalid API key (401)');if(!r.ok)throw Error('API error '+r.status);return r.json()}
async function loadInvoices(){S.loading=true;S.err='';render();let all=[];
 try{for(let p=1;p<=15;p++){const j=await api(`/shops/${S.shop}/invoices?page=${p}&per_page=100`);
  const d=Array.isArray(j)?j:(j.data||[]);all=all.concat(d);if(Array.isArray(j)||!j.next_page_url||!d.length)break}
  S.inv=all}catch(e){S.err=e.message}S.loading=false;render()}
async function login(){const el=$('#k');if(el)S.key=el.value.trim();S.err='';if(!S.key)return;
 try{const j=await api('/shops');S.shops=Array.isArray(j)?j:(j.data||[]);ls.s('sa_key',S.key);
  S.shop=ls.g('sa_shop')||S.shops[0]?.id;if(!S.shops.find(s=>String(s.id)==String(S.shop)))S.shop=S.shops[0]?.id;
  await loadInvoices()}catch(e){S.err=e.message;render()}}
function logout(){ls.s('sa_key','');S.key='';S.inv=[];S.shops=[];render()}
function sum(f){return S.inv.filter(i=>done(i)&&f(when(i))).reduce((a,i)=>a+amt(i),0)}
function home(){const n=new Date(),sod=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 const d7=new Date(sod-6*864e5),d30=new Date(sod-29*864e5);
 const days=[...Array(14)].map((_,k)=>{const a=new Date(sod-(13-k)*864e5),b=new Date(+a+864e5);return sum(t=>t>=a&&t<b)});
 const mx=Math.max(...days,1);const paid=S.inv.filter(done);
 return `<div class="card"><h1>Today</h1><div class="big amt">${money(sum(t=>t>=sod))}</div>
 <div class="bars amt">${days.map(v=>`<i style="height:${v/mx*100}%"></i>`).join('')}</div><div class="k" style="margin-top:6px">Last 14 days</div></div>
 <div class="grid"><div class="card"><div class="k">7 days</div><div class="v amt">${money(sum(t=>t>=d7))}</div></div>
 <div class="card"><div class="k">30 days</div><div class="v amt">${money(sum(t=>t>=d30))}</div></div>
 <div class="card"><div class="k">All loaded</div><div class="v amt">${money(sum(()=>true))}</div></div>
 <div class="card"><div class="k">Avg. order</div><div class="v amt">${money(paid.length?paid.reduce((a,i)=>a+amt(i),0)/paid.length:0)}</div></div>
 <div class="card"><div class="k">Paid orders</div><div class="v">${paid.length}</div></div>
 <div class="card"><div class="k">Unpaid / other</div><div class="v">${S.inv.length-paid.length}</div></div></div>
 <div class="k" style="margin-top:10px">Based on ${S.inv.length} loaded invoices (max 1500).</div>`}
function list(){const q=S.q.toLowerCase();
 const r=S.inv.filter(i=>!q||[i.id,i.unique_id,i.email,i.customer_email,i.status].some(x=>String(x??'').toLowerCase().includes(q)));
 return `<input id="q" placeholder="Search invoice ID, email, status" value="${esc(S.q)}" oninput="S.q=this.value;sl()">
 <div class="card" id="L">${rows(r)}</div>`}
function rows(r){return r.slice(0,100).map(i=>`<div class="inv" onclick="detail('${esc(i.id)}')"><div><div>#${esc(i.id)} <span class="pill ${esc(String(i.status).toLowerCase())}">${esc(i.status||'?')}</span></div>
 <div class="k">${esc(i.email||i.customer_email||'')} · ${when(i).toLocaleString()}</div></div><b class="amt">${money(amt(i))}</b></div>`).join('')||'<div class="k">No matches.</div>'}
function sl(){const q=S.q.toLowerCase();$('#L').innerHTML=rows(S.inv.filter(i=>!q||[i.id,i.unique_id,i.email,i.customer_email,i.status].some(x=>String(x??'').toLowerCase().includes(q))))}
async function detail(id){S.open={id,loading:true};render();
 try{S.open={id,data:await api(`/shops/${S.shop}/invoices/${id}`)}}catch(e){S.open={id,error:e.message}}render()}
function modal(){const o=S.open;if(!o)return'';
 return `<div class="card" style="position:fixed;inset:12px;overflow:auto;z-index:9;margin:0;background:var(--sf2)">
 <div class="row sp"><b>Invoice #${esc(o.id)}</b><button class="g" onclick="S.open=null;render()">Close</button></div>
 ${o.loading?'<p class="k">Loading…</p>':o.error?`<p class="err">${esc(o.error)}</p>`:`<pre>${esc(JSON.stringify(o.data,null,2))}</pre>`}
 <button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(o.id)}')">Copy invoice ID</button></div>`}
function settings(){return `<div class="card"><div class="k">Shop</div><select onchange="S.shop=this.value;ls.s('sa_shop',this.value);loadInvoices()">
 ${S.shops.map(s=>`<option value="${esc(s.id)}" ${s.id==S.shop?'selected':''}>${esc(s.name||s.id)}</option>`).join('')}</select>
 <div class="k" style="margin-top:12px">Currency</div><select onchange="S.cur=this.value;ls.s('sa_cur',this.value);render()">
 ${['USD','EUR','GBP','CAD','AUD'].map(c=>`<option ${c==S.cur?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="card"><button class="g" onclick="S.hide=!S.hide;ls.s('sa_hide',S.hide?1:'');render()">${S.hide?'Show':'Hide'} amounts</button></div>
 <div class="card"><button class="g" onclick="logout()">Log out and forget API key</button></div>
 <div class="k">Unofficial app. Your key stays on this device and is only sent to api.sellauth.com.</div>`}
function render(){const a=$('#app');document.body.className=S.hide?'hide':'';
 if(!S.key||!S.shops.length){a.innerHTML=`<h1>SellAuth dashboard (unofficial)</h1><div class="big">Sign in</div>
 <p class="k">Paste an API key from your SellAuth account settings.</p><input id="k" type="password" placeholder="API key" autocomplete="off"><br><br>
 <button onclick="login()">Connect</button><div class="err">${esc(S.err)}</div>`;return}
 const pane={home,list,settings}[S.tab]();
 a.innerHTML=`<div class="row sp"><h1>${esc(S.shops.find(s=>s.id==S.shop)?.name||'Shop')}</h1><button class="g" onclick="loadInvoices()">${S.loading?'Loading…':'Refresh'}</button></div>
 ${S.err?`<div class="err">${esc(S.err)}</div>`:''}${pane}${modal()}
 <nav>${[['home','Income'],['list','Invoices'],['settings','Settings']].map(([t,l])=>`<button class="${S.tab==t?'on':''}" onclick="S.tab='${t}';render()">${l}</button>`).join('')}</nav>`}
S.hide=!!ls.g('sa_hide');S.cur=ls.g('sa_cur')||'USD';S.key=ls.g('sa_key')||'';
render();if(S.key){setTimeout(login,0)}

setInterval(()=>{if(S.key&&S.shop&&!S.loading&&!S.open)loadInvoices()},120000);
</script></body></html>
