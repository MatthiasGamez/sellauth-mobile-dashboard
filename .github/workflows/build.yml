name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Android permissions and SDK
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 24/' android/variables.gradle
      - name: Copy background runner JS engine
        run: |
          AAR=$(find node_modules -name 'android-js-engine-release.aar' | head -n 1)
          echo "Found: $AAR"
          test -n "$AAR"
          mkdir -p android/app/libs android/capacitor-cordova-android-plugins/src/main/libs
          cp "$AAR" android/app/libs/
          cp "$AAR" android/capacitor-cordova-android-plugins/src/main/libs/
      - name: Align JVM targets
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          cat >> android/build.gradle <<'GRADLE'

          subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
                  p.tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach {
                      kotlinOptions { jvmTarget = '17' }
                  }
              }
          }
          GRADLE
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SA-Dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
